<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViaCars.eu - Marketplace Auto Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0a0a0a;
            color: #ffffff;
        }
        .brand-logo {
            transition: all 0.3s ease;
        }
        .brand-logo:hover {
            transform: scale(1.1);
            filter: brightness(1.2);
        }
        .car-card {
            background: linear-gradient(145deg, #1a1a1a, #2a2a2a);
            border: 1px solid #333;
        }
        .car-card:hover {
            border-color: #c0c0c0;
            box-shadow: 0 10px 30px rgba(192, 192, 192, 0.1);
        }
        .search-input {
            background-color: #1a1a1a;
            border: 1px solid #333;
            color: #ffffff;
        }
        .search-input:focus {
            border-color: #c0c0c0;
            outline: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #c0c0c0, #ffffff);
            color: #0a0a0a;
            font-weight: bold;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #ffffff, #c0c0c0);
        }
    </style>
</head>
<body class="font-sans">

    <!-- HEADER -->
    <header class="bg-black border-b border-gray-800 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-car-side text-gray-300 text-3xl"></i>
                <span class="text-2xl font-bold text-white">ViaCars<span class="text-gray-400">.eu</span></span>
            </div>
            <nav class="hidden md:flex space-x-8 font-medium">
                <a href="#" class="text-white hover:text-gray-300 transition">Cumpără</a>
                <a href="#" class="text-white hover:text-gray-300 transition">Vinde</a>
                <a href="#" class="text-white hover:text-gray-300 transition">Dealeri</a>
                <a href="#" class="text-white hover:text-gray-300 transition">Noutăți</a>
            </nav>
            <div class="flex space-x-3">
                <a href="#" class="px-4 py-2 text-gray-300 font-medium hover:text-white transition">Logare</a>
                <a href="#" class="px-4 py-2 bg-white text-black font-bold rounded-lg hover:bg-gray-200 transition shadow-lg">
                    <i class="fa-solid fa-plus mr-2"></i>Adaugă Anunț
                </a>
            </div>
        </div>
    </header>

    <!-- HERO SECTION + BARA DE CĂUTARE -->
    <section class="relative py-20 bg-gradient-to-b from-black to-gray-900">
        <div class="container mx-auto px-4">
            <div class="text-center mb-12">
                <h1 class="text-5xl font-bold text-white mb-4">Găsește mașina perfectă</h1>
                <p class="text-gray-400 text-lg">Peste 12.450 de anunțuri verificate</p>
            </div>
